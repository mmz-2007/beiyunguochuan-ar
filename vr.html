<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VR 民俗文化空间 · 北韵晋创</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC","Microsoft YaHei",sans-serif;
      background: #0f1318; color: #e8e2d4;
      min-height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* ---- 顶部导航 ---- */
    .topbar {
      display: flex; align-items: center;
      padding: 14px 16px;
      background: rgba(26,33,41,0.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky; top: 0; z-index: 100;
    }
    .back-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(212,162,78,0.1);
      border: 1px solid rgba(212,162,78,0.25);
      border-radius: 10px; color: #d4a24e; font-size: 18px;
      text-decoration: none;
    }
    .topbar-title {
      flex: 1; text-align: center; font-size: 16px; font-weight: 600;
      color: #f5f0e6; margin-right: 36px;
    }
    .topbar-title span {
      font-size: 11px; color: #8a9099; font-weight: 400; margin-left: 6px;
    }

    /* ---- 3D 画布容器 ---- */
    #canvas-container {
      flex: 1; position: relative; width: 100%; height: 70vh;
    }
    #three-canvas { width: 100%; height: 100%; display: block; }

    /* ---- 控制面板 ---- */
    .controls {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px;
      background: rgba(26,33,41,0.85); backdrop-filter: blur(10px);
      padding: 8px 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 10;
    }
    .ctrl-btn {
      width: 40px; height: 40px;
      background: rgba(16,20,24,0.6);
      border: 1px solid rgba(212,162,78,0.2);
      border-radius: 50%;
      color: #d4a24e; font-size: 18px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .ctrl-btn:active {
      background: rgba(212,162,78,0.2);
      transform: scale(0.9);
    }
    .ctrl-btn.active {
      background: rgba(212,162,78,0.3);
      border-color: #d4a24e;
    }

    /* ---- 信息卡片 ---- */
    .info-card {
      position: absolute; top: 16px; left: 16px; right: 16px;
      background: rgba(26,33,41,0.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px 16px;
      z-index: 10;
      display: none;
      animation: slideDown 0.3s ease-out;
    }
    .info-card.show { display: block; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .info-card h3 {
      font-size: 15px; color: #d4a24e; margin-bottom: 4px;
    }
    .info-card p {
      font-size: 12px; color: #8a9099; line-height: 1.5;
    }

    /* ---- 模型选择条 ---- */
    .model-bar {
      padding: 12px 16px;
      background: rgba(26,33,41,0.9);
      border-top: 1px solid rgba(255,255,255,0.06);
      overflow-x: auto; white-space: nowrap;
      scrollbar-width: none;
    }
    .model-bar::-webkit-scrollbar { display: none; }
    .model-item {
      display: inline-block;
      background: rgba(16,20,24,0.6);
      border: 1px solid rgba(212,162,78,0.15);
      border-radius: 10px; padding: 8px 14px;
      margin-right: 8px; cursor: pointer;
      transition: all 0.2s; text-align: center;
      min-width: 80px;
    }
    .model-item.active {
      background: rgba(212,162,78,0.2);
      border-color: #d4a24e;
    }
    .model-item .icon { font-size: 20px; }
    .model-item .name {
      font-size: 11px; color: #8a9099; margin-top: 4px;
    }
    .model-item.active .name { color: #f5e6c8; }

    /* ---- VR模式提示 ---- */
    .vr-banner {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(26,33,41,0.95);
      border: 1px solid rgba(212,162,78,0.3);
      border-radius: 16px; padding: 24px 28px;
      text-align: center; z-index: 20;
      display: none;
    }
    .vr-banner.show { display: block; }
    .vr-banner h2 {
      font-size: 18px; color: #d4a24e; margin-bottom: 8px;
    }
    .vr-banner p {
      font-size: 13px; color: #8a9099; line-height: 1.6; margin-bottom: 14px;
    }
    .vr-banner .vr-btn {
      background: linear-gradient(135deg, #d4a24e, #b3473a);
      border: none; border-radius: 10px;
      padding: 10px 28px; color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .vr-banner .close-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 10px 20px;
      color: #6a7078; font-size: 14px; cursor: pointer;
      margin-left: 8px;
    }

    /* ---- 加载提示 ---- */
    .loading-overlay {
      position: absolute; inset: 0;
      background: rgba(15,19,24,0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 50; gap: 12px;
    }
    .loading-overlay .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(212,162,78,0.2);
      border-top-color: #d4a24e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay p { font-size: 13px; color: #6a7078; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="./index.html" class="back-btn">‹</a>
    <div class="topbar-title">VR 民俗文化空间<span>WebXR</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="three-canvas"></canvas>

    <!-- 加载提示 -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p>正在加载3D模型...</p>
    </div>

    <!-- 信息卡片 -->
    <div class="info-card" id="infoCard">
      <h3 id="infoTitle">晋祠圣母殿</h3>
      <p id="infoDesc">始建于北宋天圣年间，是中国现存最早的带木雕盘龙的古建筑...</p>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
      <button class="ctrl-btn" id="rotateBtn" title="自动旋转">↻</button>
      <button class="ctrl-btn" id="resetBtn" title="重置视角">⊙</button>
      <button class="ctrl-btn" id="infoBtn" title="文化信息">ℹ</button>
      <button class="ctrl-btn" id="vrBtn" title="VR模式">📹</button>
    </div>

    <!-- VR模式提示 -->
    <div class="vr-banner" id="vrBanner">
      <h2>📱 VR 沉浸模式</h2>
      <p>将手机横放入VR纸盒眼镜<br>即可沉浸式浏览3D文化空间</p>
      <button class="vr-btn" onclick="enterVR()">进入VR模式</button>
      <button class="close-btn" onclick="closeVRBanner()">暂不体验</button>
    </div>
  </div>

  <!-- 模型选择条 -->
  <div class="model-bar" id="modelBar">
    <div class="model-item active" onclick="loadModel(0, this)">
      <div class="icon">🧧</div><div class="name">龙鹤福</div>
    </div>
    <div class="model-item" onclick="loadModel(1, this)">
      <div class="icon">🏯</div><div class="name">魁星楼</div>
    </div>
  </div>

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ============ 场景配置 ============
    const models = [
      { url: './assets/model_13.glb', name: '龙鹤福 3D 文化场景', desc: '取材于中阳剪纸纹样，龙鹤谐音"隆贺"，寓意福运绵长、吉祥如意，是山西民间美术的代表。' },
      { url: './assets/model_06.glb', name: '魁星楼', desc: '魁星楼是中国传统建筑，供奉主管文运的魁星，寄托金榜题名的美好愿望，是山西地方文脉的象征。' }
    ];

    // ============ Three.js 初始化 ============
    const canvas = document.getElementById('three-canvas');
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1318);
    scene.fog = new THREE.Fog(0x0f1318, 5, 20);

    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // 灯光
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffd4a0, 0.8);
    dirLight.position.set(3, 5, 3);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x4a7d8c, 0.3);
    fillLight.position.set(-3, 2, -3);
    scene.add(fillLight);

    // 地面
    const groundGeo = new THREE.CircleGeometry(5, 32);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1f26, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    scene.add(ground);

    // 网格辅助线
    const grid = new THREE.GridHelper(8, 16, 0x2a2f36, 0x1a1f26);
    scene.add(grid);

    // 控制器
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 1.5;
    controls.maxDistance = 8;
    controls.maxPolarAngle = Math.PI / 2 + 0.3;

    // ============ 模型加载 ============
    const loader = new GLTFLoader();
    let currentModel = null;
    let autoRotate = false;
    let isVR = false;

    window.loadModel = function(index, el) {
      // 更新选中状态
      document.querySelectorAll('.model-item').forEach(m => m.classList.remove('active'));
      if (el) el.classList.add('active');

      const config = models[index];

      // 更新信息卡片
      document.getElementById('infoTitle').textContent = config.name;
      document.getElementById('infoDesc').textContent = config.desc;

      // 显示加载
      document.getElementById('loadingOverlay').style.display = 'flex';

      // 移除旧模型
      if (currentModel) {
        scene.remove(currentModel);
        // 释放资源
        currentModel.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else obj.material.dispose();
          }
        });
        currentModel = null;
      }

      loader.load(
        config.url,
        function(gltf) {
          currentModel = gltf.scene;

          // 自动缩放到合适大小
          const box = new THREE.Box3().setFromObject(currentModel);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 1.5 / Math.max(maxDim, 0.01);
          currentModel.scale.setScalar(scale);

          // 居中
          box.setFromObject(currentModel);
          const center = box.getCenter(new THREE.Vector3());
          currentModel.position.x -= center.x;
          currentModel.position.z -= center.z;
          currentModel.position.y -= box.min.y - 0.05;

          scene.add(currentModel);

          // 隐藏加载
          document.getElementById('loadingOverlay').style.display = 'none';

          // 显示信息卡片
          showInfoCard();
        },
        function(xhr) {
          // 进度
          if (xhr.lengthComputable) {
            const pct = Math.round(xhr.loaded / xhr.total * 100);
            document.querySelector('.loading-overlay p').textContent = `加载中... ${pct}%`;
          }
        },
        function(err) {
          console.error('模型加载失败:', err);
          document.querySelector('.loading-overlay p').textContent = '模型加载失败，请检查网络';
          // 3秒后隐藏
          setTimeout(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
          }, 3000);
        }
      );
    }

    // ============ 控制按钮 ============
    const rotateBtn = document.getElementById('rotateBtn');
    rotateBtn.addEventListener('click', () => {
      autoRotate = !autoRotate;
      rotateBtn.classList.toggle('active', autoRotate);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      camera.position.set(0, 1.5, 4);
      controls.target.set(0, 0.5, 0);
      controls.update();
    });

    const infoBtn = document.getElementById('infoBtn');
    infoBtn.addEventListener('click', () => {
      const card = document.getElementById('infoCard');
      card.classList.toggle('show');
      infoBtn.classList.toggle('active', card.classList.contains('show'));
    });

    function showInfoCard() {
      document.getElementById('infoCard').classList.add('show');
      infoBtn.classList.add('active');
    }

    // VR模式
    document.getElementById('vrBtn').addEventListener('click', () => {
      document.getElementById('vrBanner').classList.add('show');
    });

    window.closeVRBanner = function() {
      document.getElementById('vrBanner').classList.remove('show');
    }

    window.enterVR = function() {
      document.getElementById('vrBanner').classList.remove('show');
      if (navigator.getVRDisplays) {
        navigator.getVRDisplays().then(displays => {
          if (displays.length > 0) {
            isVR = true;
            const vrDisplay = displays[0];
            vrDisplay.requestPresent([{ source: canvas }]);
          } else {
            alert('未检测到VR设备，请将手机放入VR纸盒眼镜后重试');
          }
        }).catch(() => {
          alert('VR模式启动失败，请在HTTPS环境下使用');
        });
      } else {
        alert('您的浏览器不支持WebVR，请使用Chrome浏览器体验');
      }
    }

    // ============ 渲染循环 ============
    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate && currentModel) {
        currentModel.rotation.y += 0.008;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    // ============ 窗口自适应 ============
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // ============ 初始化：加载第一个模型 ============
    loadModel(0, document.querySelector('.model-item'));
    animate();
  </script>

</body>
</html>
