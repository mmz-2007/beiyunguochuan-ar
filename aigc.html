<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AIGC 非遗纹样生成器 · 北韵晋创</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC","Microsoft YaHei",sans-serif;
      background: #0f1318; color: #e8e2d4;
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* ---- 顶部导航 ---- */
    .topbar {
      display: flex; align-items: center;
      padding: 14px 16px;
      background: rgba(26,33,41,0.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky; top: 0; z-index: 10;
    }
    .back-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(212,162,78,0.1);
      border: 1px solid rgba(212,162,78,0.25);
      border-radius: 10px; color: #d4a24e; font-size: 18px;
      text-decoration: none;
    }
    .topbar-title {
      flex: 1; text-align: center; font-size: 16px; font-weight: 600;
      color: #f5f0e6; margin-right: 36px;
    }
    .topbar-title span {
      font-size: 11px; color: #8a9099; font-weight: 400; margin-left: 6px;
    }

    /* ---- 主体 ---- */
    .main {
      flex: 1; padding: 20px 16px;
      max-width: 480px; width: 100%; margin: 0 auto;
    }

    /* ---- 输入区 ---- */
    .input-section {
      background: rgba(26,33,41,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
    }
    .input-section h2 {
      font-size: 15px; color: #d4a24e; margin-bottom: 12px;
    }
    .theme-btns {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    }
    .theme-btn {
      background: rgba(16,20,24,0.8);
      border: 1px solid rgba(212,162,78,0.2);
      color: #d4a24e; padding: 8px 14px;
      border-radius: 999px; font-size: 13px;
      cursor: pointer; transition: all 0.2s;
    }
    .theme-btn.active {
      background: rgba(212,162,78,0.2);
      border-color: #d4a24e; color: #f5e6c8;
    }
    .custom-input {
      width: 100%;
      background: rgba(16,20,24,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 10px 14px;
      color: #e8e2d4; font-size: 14px; font-family: inherit;
      outline: none; margin-bottom: 12px;
    }
    .custom-input:focus { border-color: rgba(212,162,78,0.4); }
    .custom-input::placeholder { color: #4a5058; }
    .generate-btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #d4a24e, #b3473a);
      border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .generate-btn:active { transform: scale(0.97); }
    .generate-btn:disabled {
      background: #3a3530; color: #6a6058; cursor: not-allowed;
    }

    /* ---- 结果区 ---- */
    .result-section {
      display: none;
      background: rgba(26,33,41,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 20px;
      animation: fadeIn 0.4s ease-out;
    }
    .result-section.show { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .result-section h2 {
      font-size: 15px; color: #d4a24e; margin-bottom: 14px;
    }

    /* 纹样描述 */
    .pattern-desc {
      background: rgba(16,20,24,0.6);
      border-radius: 10px; padding: 14px;
      margin-bottom: 16px;
    }
    .pattern-desc .label {
      font-size: 11px; color: #6a7078; margin-bottom: 6px;
    }
    .pattern-desc .text {
      font-size: 13px; color: #c8c0b0; line-height: 1.7;
    }

    /* 纹样图 */
    .pattern-image {
      width: 100%; aspect-ratio: 1; max-width: 280px;
      margin: 0 auto 16px; border-radius: 12px; overflow: hidden;
      background: rgba(16,20,24,0.6);
      display: flex; align-items: center; justify-content: center;
    }
    .pattern-image img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .pattern-image .loading {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .pattern-image .loading .dots {
      display: flex; gap: 4px;
    }
    .pattern-image .loading .dots span {
      width: 8px; height: 8px; background: #d4a24e;
      border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .pattern-image .loading .dots span:nth-child(2) { animation-delay: 0.2s; }
    .pattern-image .loading .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    /* 文化解读 */
    .culture-note {
      background: rgba(16,20,24,0.6);
      border-radius: 10px; padding: 14px; margin-bottom: 14px;
    }
    .culture-note .label {
      font-size: 11px; color: #6a7078; margin-bottom: 6px;
    }
    .culture-note .text {
      font-size: 13px; color: #c8c0b0; line-height: 1.7;
    }

    /* 操作按钮 */
    .action-btns {
      display: flex; gap: 10px;
    }
    .action-btn {
      flex: 1; padding: 10px;
      background: rgba(26,33,41,0.8);
      border: 1px solid rgba(212,162,78,0.25);
      border-radius: 10px; color: #d4a24e;
      font-size: 13px; cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .action-btn:active {
      background: rgba(212,162,78,0.15); transform: scale(0.96);
    }

    /* ---- 说明 ---- */
    .tips {
      font-size: 11px; color: #4a5058; text-align: center;
      padding: 16px 0; line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="./index.html" class="back-btn">‹</a>
    <div class="topbar-title">AIGC 纹样生成器<span>豆包驱动</span></div>
  </div>

  <div class="main">
    <!-- 输入区 -->
    <div class="input-section">
      <h2>🎨 选择非遗主题</h2>
      <div class="theme-btns" id="themeBtns">
        <button class="theme-btn active" onclick="selectTheme(this, '中阳剪纸')">中阳剪纸</button>
        <button class="theme-btn" onclick="selectTheme(this, '广灵染色剪纸')">广灵剪纸</button>
        <button class="theme-btn" onclick="selectTheme(this, '平遥推光漆器')">推光漆器</button>
        <button class="theme-btn" onclick="selectTheme(this, '孝义皮影')">孝义皮影</button>
        <button class="theme-btn" onclick="selectTheme(this, '晋剧脸谱')">晋剧脸谱</button>
      </div>
      <input type="text" class="custom-input" id="customInput" placeholder="或输入自定义关键词（如：龙凤呈祥、福寿双全）" onkeydown="if(event.key==='Enter')generate()">
      <button class="generate-btn" id="genBtn" onclick="generate()">✨ 生成纹样方案</button>
    </div>

    <!-- 结果区 -->
    <div class="result-section" id="resultSection">
      <h2>📊 生成结果</h2>

      <div class="pattern-desc" id="descBox" style="display:none;">
        <div class="label">纹样设计方案</div>
        <div class="text" id="descText"></div>
      </div>

      <div class="pattern-image" id="imgBox" style="display:none;">
        <div class="loading" id="imgLoading">
          <div class="dots"><span></span><span></span><span></span></div>
          <div style="font-size:11px;color:#6a7078;">生成纹样图中...</div>
        </div>
        <img id="patternImg" style="display:none;" />
      </div>

      <div class="culture-note" id="cultureBox" style="display:none;">
        <div class="label">文化解读</div>
        <div class="text" id="cultureText"></div>
      </div>

      <div class="action-btns">
        <button class="action-btn" onclick="downloadResult()">💾 保存方案</button>
        <button class="action-btn" onclick="generate()">🔄 再生成一个</button>
      </div>
    </div>

    <div class="tips">
      AIGC = AI Generated Content<br>
      本工具由豆包大模型驱动，自动生成非遗纹样设计方案与文化解读
    </div>
  </div>

  <script>
    // ============ 配置 ============
    const API_KEY = 'ark-1251279f-f299-4eb6-8d5d-0fed82daf653-a4265';
    const MODEL = 'doubao-1-5-lite-32k-250115';
    const API_URL = 'https://ark.cn-beijing.volces.com/api/v3/chat/completions';

    // 图片生成API（免费）
    const IMG_API = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image';

    let currentTheme = '中阳剪纸';
    let lastResult = '';

    // ============ 交互 ============
    function selectTheme(btn, theme) {
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTheme = theme;
    }

    async function generate() {
      const custom = document.getElementById('customInput').value.trim();
      const keyword = custom || currentTheme;
      const btn = document.getElementById('genBtn');

      btn.disabled = true;
      btn.textContent = '⏳ 生成中...';

      // 显示结果区
      const resultSection = document.getElementById('resultSection');
      resultSection.classList.add('show');

      // 重置
      document.getElementById('descBox').style.display = 'none';
      document.getElementById('imgBox').style.display = 'none';
      document.getElementById('cultureBox').style.display = 'none';
      document.getElementById('patternImg').style.display = 'none';
      document.getElementById('imgLoading').style.display = 'flex';

      // 生成纹样方案
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + API_KEY
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              {
                role: 'system',
                content: '你是非遗纹样设计专家。根据用户给定的非遗主题，生成一个纹样设计方案。输出格式：\n\n【纹样名称】xxx\n【设计元素】xxx（50字内描述视觉元素）\n【色彩搭配】xxx（列出3-5个主色调）\n【适用产品】xxx（适合用在哪类文创产品上）\n\n然后另起一行写【文化解读】开头，用100字左右解释这个纹样的文化寓意和历史渊源。'
              },
              { role: 'user', content: '请围绕"' + keyword + '"生成一个非遗纹样设计方案' }
            ],
            temperature: 0.8,
            max_tokens: 600
          })
        });

        const data = await response.json();

        if (data.choices && data.choices[0]) {
          const result = data.choices[0].message.content;
          lastResult = result;

          // 分离纹样方案和文化解读
          const parts = result.split(/【文化解读】/);
          const patternDesign = parts[0] || result;
          const cultureNote = parts[1] || '';

          // 显示纹样方案
          document.getElementById('descText').textContent = patternDesign;
          document.getElementById('descBox').style.display = 'block';

          // 显示文化解读
          if (cultureNote) {
            document.getElementById('cultureText').textContent = '【文化解读】' + cultureNote;
            document.getElementById('cultureBox').style.display = 'block';
          }

          // 生成纹样图
          const imgPrompt = `非遗纹样设计图，主题：${keyword}，中国传统纹样风格，精美细节，对称构图，暖色调，适合文创产品应用`;
          generateImage(imgPrompt);
        }
      } catch (err) {
        document.getElementById('descText').textContent = '生成失败，请重试';
        document.getElementById('descBox').style.display = 'block';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = '✨ 生成纹样方案';
      }
    }

    async function generateImage(prompt) {
      const imgBox = document.getElementById('imgBox');
      const imgLoading = document.getElementById('imgLoading');
      const patternImg = document.getElementById('patternImg');

      imgBox.style.display = 'flex';

      try {
        const response = await fetch(IMG_API + '?prompt=' + encodeURIComponent(prompt) + '&image_size=square');
        if (response.ok) {
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          patternImg.src = url;
          patternImg.style.display = 'block';
          imgLoading.style.display = 'none';
        } else {
          throw new Error('Image API error');
        }
      } catch (err) {
        // 图片生成失败不影响文字结果
        imgLoading.innerHTML = '<div style="font-size:11px;color:#6a7078;">纹样图生成失败<br>文字方案已生成 ✓</div>';
        console.error('Image generation failed:', err);
      }
    }

    function downloadResult() {
      if (!lastResult) return;
      const blob = new Blob([lastResult], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '非遗纹样方案_' + Date.now() + '.txt';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
