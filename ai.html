<html lang="zh-CN" data-trae-theme="light"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 文化讲解员 · 北韵晋创</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC","Microsoft YaHei",sans-serif;
      background: #101418; color: #e8e2d4;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ---- 顶部导航 ---- */
    .topbar {
      display: flex; align-items: center;
      padding: 14px 16px;
      background: rgba(26,33,41,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky; top: 0; z-index: 10;
    }
    .back-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(212,162,78,0.1);
      border: 1px solid rgba(212,162,78,0.25);
      border-radius: 10px;
      color: #d4a24e; font-size: 18px;
      text-decoration: none;
    }
    .topbar-title {
      flex: 1; text-align: center;
      font-size: 16px; font-weight: 600;
      color: #f5f0e6;
      margin-right: 36px;
    }
    .topbar-title span {
      font-size: 12px; color: #8a9099;
      font-weight: 400; margin-left: 6px;
    }

    /* ---- 聊天气泡 ---- */
    .chat-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      display: flex;
      margin-bottom: 14px;
      animation: msgIn 0.3s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user { justify-content: flex-end; }
    .msg .avatar {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .msg.ai .avatar {
      background: rgba(212,162,78,0.15);
      margin-right: 8px;
    }
    .msg.user .avatar {
      background: rgba(74,125,140,0.18);
      margin-left: 8px;
    }
    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.65;
      word-wrap: break-word;
    }
    .msg.ai .bubble {
      background: rgba(26,33,41,0.9);
      border: 1px solid rgba(255,255,255,0.06);
      border-top-left-radius: 4px;
      color: #e8e2d4;
    }
    .msg.user .bubble {
      background: rgba(212,162,78,0.18);
      border: 1px solid rgba(212,162,78,0.3);
      border-top-right-radius: 4px;
      color: #f5e6c8;
    }
    .typing {
      display: flex; gap: 4px; padding: 4px 0;
    }
    .typing span {
      width: 6px; height: 6px;
      background: #d4a24e;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ---- 快捷问题 ---- */
    .quick-questions {
      padding: 0 16px 12px;
      max-width: 480px; width: 100%;
      margin: 0 auto;
    }
    .quick-questions p {
      font-size: 12px; color: #6a7078;
      margin-bottom: 8px;
    }
    .q-btns {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .q-btn {
      background: rgba(26,33,41,0.8);
      border: 1px solid rgba(212,162,78,0.2);
      color: #d4a24e;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .q-btn:active {
      background: rgba(212,162,78,0.15);
      transform: scale(0.96);
    }

    /* ---- 输入框 ---- */
    .input-area {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(26,33,41,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.06);
      max-width: 480px; width: 100%;
      margin: 0 auto;
    }
    .input-row {
      display: flex; gap: 10px; align-items: flex-end;
    }
    .input-row textarea {
      flex: 1;
      background: rgba(16,20,24,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 14px;
      color: #e8e2d4;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 100px;
      min-height: 42px;
    }
    .input-row textarea:focus {
      border-color: rgba(212,162,78,0.4);
    }
    .input-row textarea::placeholder {
      color: #4a5058;
    }
    .send-btn {
      width: 42px; height: 42px;
      background: #d4a24e;
      border: none;
      border-radius: 12px;
      color: #1a1510;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled {
      background: #3a3530;
      color: #6a6058;
      cursor: not-allowed;
    }

    /* ---- 欢迎卡片 ---- */
    .welcome {
      text-align: center;
      padding: 40px 20px 30px;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .welcome .ai-icon {
      width: 70px; height: 70px;
      margin: 0 auto 16px;
      background: rgba(212,162,78,0.12);
      border: 2px solid rgba(212,162,78,0.3);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    .welcome h2 {
      font-size: 18px; color: #f5f0e6;
      margin-bottom: 6px;
    }
    .welcome p {
      font-size: 13px; color: #8a9099;
      line-height: 1.6;
    }
  </style>

<body>

  <!-- 顶部导航 -->
  <div class="topbar">
    <a href="./index.html" class="back-btn">‹</a>
    <div class="topbar-title">AI 文化讲解员<span>豆包驱动</span></div>
  </div>

  <!-- 聊天区域 -->
  <div class="chat-container" id="chatContainer">
    <!-- 欢迎页 -->
    <div class="welcome" id="welcome">
      <div class="ai-icon">🏯</div>
      <h2>你好，我是山西文化讲解员</h2>
      <p>我可以回答关于山西非遗、古建、民俗、节庆等问题<br>随时问我，一起探索三晋文化</p>
    </div>
  </div>

  <!-- 快捷问题 -->
  <div class="quick-questions" id="quickQuestions">
    <p>💡 试试问这些：</p>
    <div class="q-btns">
      <button class="q-btn" onclick="askQuick('晋祠圣母殿是什么时候建的？')">晋祠圣母殿是什么时候建的？</button>
      <button class="q-btn" onclick="askQuick('中阳剪纸有什么特点？')">中阳剪纸有什么特点？</button>
      <button class="q-btn" onclick="askQuick('平遥古城有多少年历史？')">平遥古城有多少年历史？</button>
      <button class="q-btn" onclick="askQuick('寒食节是怎么来的？')">寒食节是怎么来的？</button>
      <button class="q-btn" onclick="askQuick('山西有哪些著名的非遗？')">山西有哪些著名的非遗？</button>
    </div>
  </div>

  <!-- 输入区域 -->
  <div class="input-area">
    <div class="input-row">
      <textarea id="userInput" placeholder="问问山西的文化和非遗..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    // ============ 配置 ============
    const API_KEY = ['ark-1251279f', '-f299-4eb6-8d5d', '-0fed82daf653', '-a4265'].join('');
    const MODEL = 'doubao-seed-2-0-lite-260428';
    const API_URL = 'https://ark.cn-beijing.volces.com/api/v3/chat/completions';

    // 系统提示词：AI 人设
    const SYSTEM_PROMPT = `你是「北韵晋创」的山西民俗文化AI讲解员，专门介绍山西非遗、民俗文化、古建知识。

你的知识范围：
- 山西国家级和省级非物质文化遗产（如中阳剪纸、推光漆器、晋祠庙会等）
- 山西古建筑（晋祠圣母殿、平遥古城、应县木塔、云冈石窟、关帝庙等）
- 山西民俗节庆（晋祠庙会、寒食节、社火、威风锣鼓等）
- 山西传统技艺（剪纸、漆器、琉璃烧制、面食技艺等）
- 山西民间文学和传说（介子推、双塔传说等）

回答要求：
1. 语言通俗易懂，像导游一样亲切自然
2. 每次回答控制在200字以内，简洁明了
3. 如果问到你不知道的内容，说"这个问题我还在学习中呢，换个关于山西文化的问题问问我吧~"，不要编造
4. 可以适当引用古诗词或历史典故，增加文化韵味
5. 回答语气要温暖热情，结尾可以加一句小引导，比如"想了解更多山西文化随时问我~"
6. 如果用户问的是积木产品相关，可以说"这是北韵晋创的文创积木产品，扫一扫就能看到AR效果哦~"

北韵晋创产品系列（13款）：
- 城市字体系列：太原、大同、平遥、晋中（榆次老城）、晋祠、水镜台、关帝庙
- 地标古建系列：六府塔、鹳雀楼、普救寺莺莺塔、临县黑龙庙
- 非遗装饰系列：龙鹤福（中阳剪纸纹样）
- 红色军工系列：刘伯承工厂`;

    // ============ 状态 ============
    let messages = [
      { role: 'system', content: SYSTEM_PROMPT }
    ];
    let isLoading = false;

    // ============ DOM ============
    const chatContainer = document.getElementById('chatContainer');
    const welcome = document.getElementById('welcome');
    const quickQuestions = document.getElementById('quickQuestions');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // ============ 功能函数 ============

    // 自适应输入框高度
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    // 回车发送（Shift+回车换行）
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // 快捷问题
    function askQuick(q) {
      userInput.value = q;
      sendMessage();
    }

    // 添加消息气泡
    function addMessage(role, content, isTyping = false) {
      // 首次发消息隐藏欢迎页
      if (welcome && welcome.style.display !== 'none') {
        welcome.style.display = 'none';
      }

      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg ' + role;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'ai' ? '🏯' : '👤';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (isTyping) {
        bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      } else {
        bubble.textContent = content;
      }

      if (role === 'ai') {
        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
      } else {
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(avatar);
      }

      chatContainer.appendChild(msgDiv);
      scrollToBottom();

      return bubble;
    }

    // 滚动到底部
    function scrollToBottom() {
      setTimeout(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 50);
    }

    // 发送消息
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isLoading) return;

      // 清空输入框
      userInput.value = '';
      userInput.style.height = 'auto';
      autoResize(userInput);

      // 添加用户消息
      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      // 添加 loading
      isLoading = true;
      sendBtn.disabled = true;
      const aiBubble = addMessage('ai', '', true);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + API_KEY
          },
          body: JSON.stringify({
            model: MODEL,
            messages: messages,
            temperature: 0.7,
            max_tokens: 500,
            thinking: { type: 'disabled' }
          })
        });

        const data = await response.json();

        if (data.choices && data.choices[0] && data.choices[0].message) {
          const reply = data.choices[0].message.content;
          aiBubble.innerHTML = '';
          // 打字机效果
          typeWriter(aiBubble, reply);
          messages.push({ role: 'assistant', content: reply });
        } else {
          aiBubble.innerHTML = '抱歉，我好像出了点小问题 😅<br><span style="font-size:11px;color:#8a9099">' + (data.error?.message || '未知错误') + '</span>';
        }
      } catch (err) {
        aiBubble.innerHTML = '网络连接失败，请检查网络后重试 📡';
        console.error(err);
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
      }
    }

    // 打字机效果
    function typeWriter(element, text, index = 0) {
      if (index < text.length) {
        element.textContent = text.slice(0, index + 1);
        scrollToBottom();
        setTimeout(() => typeWriter(element, text, index + 1), 25);
      }
    }

    // 页面加载完成自动聚焦输入框
    window.addEventListener('load', () => {
      setTimeout(() => userInput.focus(), 300);
    });
  </script>
